spring.application.name=petjourney
server.port=${PORT:8080}

# Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:petjourney}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança JWT
rsa.private-key=${RSA_PRIVATE_KEY:classpath:app.key}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:app.pub}
jwt.issuer=${JWT_ISSUER:petjourney-api}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# E-mail SMTP
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
petjourney.mail.enabled=${MAIL_ENABLED:false}
petjourney.mail.from=${MAIL_FROM:no-reply@petjourney.com}

# Configurações de Cache
spring.cache.type=simple

# DevTools
spring.devtools.restart.enabled=true
